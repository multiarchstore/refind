name: LoongArch64 EDK2 Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-loongarch64-edk2:
    runs-on: ubuntu-latest
    env:
      EDK2BASE: ${{ github.workspace }}/edk2
      ARCH: loongarch64
      EDK2_TARGET: RELEASE
      EDK2_TOOLCHAIN: GCC5

    steps:
      - name: Checkout rEFInd
        uses: actions/checkout@v4

      - name: Checkout EDK2 stable202602
        uses: actions/checkout@v4
        with:
          repository: tianocore/edk2
          ref: edk2-stable202602
          path: edk2
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            gettext \
            iasl \
            mtools \
            nasm \
            python3 \
            python3-pip \
            uuid-dev
          pip3 install -r edk2/pip-requirements.txt

      - name: Download LoongArch64 cross-toolchain
        run: |
          curl -L --fail \
            -o /tmp/x86_64-cross-tools-loongarch64-unknown-linux-gnu-latest.tar.xz \
            https://github.com/loong64/cross-tools/releases/latest/download/x86_64-cross-tools-loongarch64-unknown-linux-gnu-latest.tar.xz
          mkdir -p "$RUNNER_TEMP/x-tools"
          tar -xf /tmp/x86_64-cross-tools-loongarch64-unknown-linux-gnu-latest.tar.xz -C "$RUNNER_TEMP/x-tools"
          echo "LOONGARCH64_TOOLCHAIN_BIN=$RUNNER_TEMP/x-tools/loongarch64-unknown-linux-gnu/bin" >> "$GITHUB_ENV"
          echo "GCC5_LOONGARCH64_PREFIX=$RUNNER_TEMP/x-tools/loongarch64-unknown-linux-gnu/bin/loongarch64-unknown-linux-gnu-" >> "$GITHUB_ENV"

      - name: Prepare EDK2 BaseTools
        run: |
          make -C edk2/BaseTools -j"$(nproc)"

      - name: Build loong64 Debian package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/deb-loong64"
          build_dir="/tmp/refind-loong64"
          rm -rf "$build_dir"
          cp -a "$GITHUB_WORKSPACE" "$build_dir"
          cd "$build_dir"
          dpkg-buildpackage -us -uc -b -a loong64
          source_name="$(dpkg-parsechangelog -S Source)"
          version="$(dpkg-parsechangelog -S Version)"
          artifact_prefix="/tmp/${source_name}_${version}_loong64"
          deb_file="${artifact_prefix}.deb"
          changes_file="${artifact_prefix}.changes"
          buildinfo_file="${artifact_prefix}.buildinfo"
          [ -f "$deb_file" ] || { echo "Missing deb artifact: $deb_file"; exit 1; }
          [ -f "$changes_file" ] || { echo "Missing changes artifact: $changes_file"; exit 1; }
          [ -f "$buildinfo_file" ] || { echo "Missing buildinfo artifact: $buildinfo_file"; exit 1; }
          deb_listing="$(dpkg-deb -c "$deb_file")"
          grep -q './etc/refind.d/keys/' <<< "$deb_listing" || { echo "Missing keys directory in deb"; exit 1; }
          grep -q 'usr/share/refind/refind/refind_loongarch64.efi' <<< "$deb_listing" || { echo "Missing refind_loongarch64.efi in deb"; exit 1; }
          grep -q 'usr/share/refind/refind/drivers_loongarch64/' <<< "$deb_listing" || { echo "Missing drivers_loongarch64 in deb"; exit 1; }
          cp -a "$deb_file" "$changes_file" "$buildinfo_file" "$GITHUB_WORKSPACE/artifacts/deb-loong64/"

      - name: Build rEFInd for LoongArch64 (EDK2)
        run: |
          export PATH="$LOONGARCH64_TOOLCHAIN_BIN:$PATH"
          make EDK2BASE="$EDK2BASE" \
               ARCH="$ARCH" \
               EDK2_TARGET="$EDK2_TARGET" \
               EDK2_TOOLCHAIN="$EDK2_TOOLCHAIN" \
               edk2 fs_edk2

      - name: Upload LoongArch64 EFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: refind-loongarch64-edk2
          if-no-files-found: error
          path: |
            refind/refind_loongarch64.efi
            drivers_loongarch64/*.efi

      - name: Upload loong64 Debian package
        uses: actions/upload-artifact@v4
        with:
          name: refind-loong64-deb
          path: artifacts/deb-loong64/*
          if-no-files-found: error
